<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brands | ShowCase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="features.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-cubes-stacked" aria-hidden="true"></i><span>Show<span class="logo-highlight">Case</span></span></a>
            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="catalog.html">Products</a>
                <a href="brands.html" class="active" aria-current="page">Brands</a>
                <a href="compare.html">Compare</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="nav-actions">
                <a href="wishlist.html" class="nav-feature-active"><i class="fa-regular fa-heart" aria-hidden="true"></i> Wishlist</a>
                <a href="login.html" class="nav-account" data-account-link>Login / Register</a>
                <button type="button" class="nav-logout" data-nav-logout hidden>Logout</button>
                <a href="cart.html" class="nav-cta">Cart <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i></a>
            </div>
        </div>
    </header>

    <main class="feature-main brands-main">
        <section class="feature-heading">
            <p class="feature-eyebrow">SHOP BY MANUFACTURER</p>
            <h1 id="brandHeading">Brands &amp; Manufacturers</h1>
            <p id="brandDescription">Browse products from the makers you know.</p>
        </section>
        <div class="brand-tools">
            <label class="feature-search">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <span class="sr-only">Search brands</span>
                <input id="brandSearch" type="search" placeholder="Find a brand">
            </label>
            <a id="allBrandsLink" class="feature-text-button" href="brands.html">All brands</a>
        </div>
        <div id="brandList" class="brand-grid" aria-label="Available brands"></div>
        <section class="brand-products-section">
            <div class="feature-toolbar">
                <h2 id="brandProductsHeading">Products from all brands</h2>
                <span id="brandProductCount"></span>
            </div>
            <div id="brandProducts" class="product-grid"></div>
            <div id="brandEmpty" class="feature-empty" hidden>
                <h2>No products found</h2>
                <p>Choose another brand or browse the full catalog.</p>
                <a class="primary-btn" href="catalog.html">Explore products</a>
            </div>
        </section>
    </main>

    <script src="products.js" defer></script>
    <script src="script.js" defer></script>
    <script src="brands.js" defer></script>
</body>
</html>
